name: feed

on:
  schedule:
    - cron: "30 2 * * *"   # 03:30/04:30 Madrid
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "web/**", ".github/workflows/feed.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      # Platform observations from the collector (branch platform-data); optional: without them the
      # feeds are published without platforms.
      - name: Fetch platform observations
        run: git fetch --depth=1 origin platform-data && git show FETCH_HEAD:platforms.json > ../platforms.json || echo "no platform data"
      - name: Build feed
        run: python build_feed.py --out ../site --platforms ../platforms.json
      - name: Render legal and support pages
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CONTACT_NAME: ${{ vars.CONTACT_NAME }}
        run: python render_pages.py ../web ../site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows after 60 days without repo activity;
  # re-enabling the workflow through the API resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the nightly schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
