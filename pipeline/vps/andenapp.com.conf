# Andén website (andenapp.com) — installed as /etc/nginx/sites-enabled/andenapp.com.conf, on the
# same VPS as whatplatform.uk (the Andén API on 127.0.0.1:8520 is shared).
# Privacy: no access logs, no error logs (they would carry client addresses). Only /api/board/
# passes the client IP to the API, which counts people once a day with an in-memory daily key and
# never stores the IP or User-Agent (server/anden_api/stats.py).
#
# Pages:  /opt/anden/repo/website  (index.html, style.css, js/, icons) from the repo checkout
#         /opt/anden/pages/current (station pages, A–Z, sitemap, stations.json, legal pages), built
#         by website/build_pages.py after the nightly feed (pipeline/vps/feed.sh), swapped atomically.

# Each open board polls every 30 s; generous because carriers put many phones behind one address.
limit_req_zone $binary_remote_addr zone=anden_board:1m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name andenapp.com www.andenapp.com;
    access_log off;
    error_log /dev/null crit;

    root /var/www/certbot;
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://andenapp.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.andenapp.com;
    access_log off;
    error_log /dev/null crit;

    ssl_certificate /etc/letsencrypt/live/andenapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andenapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://andenapp.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name andenapp.com;
    access_log off;
    error_log /dev/null crit;
    include snippets/block-bad-bots.conf;
    include snippets/honeypot.conf;

    ssl_certificate /etc/letsencrypt/live/andenapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andenapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Pages revalidate on every load (ETag): a deploy or a nightly build shows at once.
    add_header Cache-Control "no-cache";

    root /opt/anden/repo/website;
    # Every 404 shows the page shell (status stays 404): the JS says "no encontrada" and offers search.
    error_page 404 /404-shell;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    location = / { try_files /index.html =404; }
    location = /robots.txt { try_files /robots.txt =404; }

    # Built pages. A stop id with no page (unknown) answers 404 with the shell.
    location ~ "^/estacion/([0-9]{5})/?$" {
        root /opt/anden/pages/current;
        try_files /estacion/$1.html =404;
    }
    location = /estaciones { root /opt/anden/pages/current; try_files /estaciones.html =404; }
    location ~ "^/privacidad/?$" { root /opt/anden/pages/current; try_files /privacidad.html =404; }
    location ~ "^/ayuda/?$" { root /opt/anden/pages/current; try_files /ayuda.html =404; }
    location ~ "^/(sitemap\.xml|stations\.json|legal\.css)$" { root /opt/anden/pages/current; try_files /$1 =404; }
    location = /404-shell { internal; try_files /index.html =404; }

    # Scripts and styles: revalidated on every load (ETag). An add_header here stops inheritance
    # from the server block: repeat them.
    location ~ "^/(style\.css|js/[a-z]+\.js)$" {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
    # Images, shown through <img> or as icons. Apple's badge styles its paths inline, which the
    # page CSP would block in browsers that apply an image's own CSP: none here.
    location ~ "^/(app-store-badge\.svg|favicon\.ico|favicon\.png|icon-192\.png|apple-touch-icon\.png)$" {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The board: the Andén API's GET /board/<stop> (server/anden_api/server.py).
    location ~ "^/api/board/([0-9]{5})$" {
        limit_except GET { deny all; }
        limit_req zone=anden_board burst=30 nodelay;
        limit_req_status 429;
        set $stop $1;
        proxy_pass http://127.0.0.1:8520/board/$stop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;  # counted once a day, never stored
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;  # answers from memory
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
