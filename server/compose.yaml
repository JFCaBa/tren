services:
  anden-api:
    build: .
    image: anden-api
    env_file: /opt/anden/.env
    ports:
      - "127.0.0.1:8520:8520"
    restart: unless-stopped
    stop_grace_period: 40s  # time to end every Live Activity on shutdown
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /opt/anden/data:/opt/anden/data:ro  # timetables (pipeline/vps/feed.sh); same path: `current` is an absolute symlink
      - /opt/anden/stats:/stats  # aggregates for /admin (owned by uid 10001)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
